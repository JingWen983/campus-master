name: Release

# 触发条件：推送 v*.*.* 标签 或 手动触发
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 版本号（如 0.0.1，不带 v 前缀）'
        required: true
        default: '0.0.1'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write   # 创建 release 需要

    steps:
      # ===== 1. Checkout =====
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # ===== 2. 解析版本号 =====
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF##*/}"   # refs/tags/v0.0.1 → v0.0.1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved release tag: $TAG"

      # ===== 3. 前端构建（Vite + Vue SFC） =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # F16：发布用 npm ci（严格按 package-lock.json 安装，不改写 lockfile）
        # 与 ci.yml:35 保持一致 → 发布可复现
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend dist
        shell: bash
        run: |
          set -e
          test -f frontend/dist/index.html || { echo "ERROR: frontend/dist/index.html missing"; exit 1; }
          # F1 守卫（与 ci.yml 的 package job 同源）：正式包前端必须是真实后端模式，
          # 不得含 mock 演示站特征串 —— 此前 release.yml 只检查 index.html 存在，
          # 若构建期误带上 VITE_USE_MOCK=true，mock 版前端会与同包 server.exe 永久失联。
          if grep -rIl "campus_mock_db_v1" frontend/dist; then
            echo "ERROR: 发布包前端含有 mock 特征串（campus_mock_db_v1）—— F1 回归"; exit 1
          fi
          if grep -rIl "\[Mock\] 未匹配的 API" frontend/dist; then
            echo "ERROR: 发布包前端含有 mock 提示串 —— F1 回归"; exit 1
          fi
          # 残留 Pages 子路径（VITE_BASE）会让站点根部署下的资源 404
          if grep -rIo "/campus-master/" frontend/dist | head -n 1 | grep -q .; then
            echo "ERROR: 发布包前端残留 VITE_BASE=/campus-master/ 子路径 —— F1 第二处根因回归"; exit 1
          fi
          # 注意（有意不加的守卫）：批次 0 交接曾建议「grep admin123 等可预测口令」，
          # 但 ChangePasswordGate.vue 的弱口令黑名单（与后端 routes_public.cpp 同源）
          # **必须**随包分发，该断言会对每个正确构建误报。可预测默认凭据的真实防线是
          # 后端首启随机口令 + 强制首登改密（B2/F13），不靠前端产物字符串。
          echo "Frontend dist OK: 非 Mock 构建 + 站点根路径"
          ls frontend/dist

      # ===== 4. C++ 后端编译（MinGW g++ + SQLite 静态链接） =====
      # windows-latest 自带 MinGW-w64 (g++ in PATH)
      - name: Compile SQLite C library
        run: gcc -c sqlite3.c -o sqlite3.o -O2

      - name: Compile C++ sources
        shell: bash
        run: |
          set -e
          g++ -c main.cpp          -o main.o          -std=c++17 -O2 -I.
          g++ -c models.cpp        -o models.o        -std=c++17 -O2 -I.
          g++ -c logger.cpp        -o logger.o        -std=c++17 -O2 -I.
          g++ -c routes_static.cpp -o routes_static.o -std=c++17 -O2 -I.
          g++ -c routes_public.cpp -o routes_public.o -std=c++17 -O2 -I.
          g++ -c routes_admin.cpp  -o routes_admin.o  -std=c++17 -O2 -I.
          g++ -c routes_teacher.cpp -o routes_teacher.o -std=c++17 -O2 -I.
          g++ -c routes_student.cpp -o routes_student.o -std=c++17 -O2 -I.
          g++ -c routes_parent.cpp -o routes_parent.o -std=c++17 -O2 -I.

      - name: Link server.exe (静态链接 MinGW 运行时)
        run: |
          g++ -o server.exe main.o models.o logger.o routes_static.o routes_public.o routes_admin.o routes_teacher.o routes_student.o routes_parent.o sqlite3.o -lws2_32 -lwsock32 -std=c++17 -O2 -static -static-libgcc -static-libstdc++ -lwinpthread

      - name: Verify server.exe 无外部 DLL 依赖
        shell: bash
        run: |
          test -f server.exe || { echo "ERROR: server.exe missing"; exit 1; }
          echo "server.exe built OK"
          ls -lh server.exe
          # 检查依赖的 DLL（应为空或仅 Windows 系统 DLL）
          echo "=== DLL 依赖检查 ==="
          objdump -p server.exe 2>/dev/null | grep "DLL Name:" || echo "无 DLL 依赖信息"

      # ===== 5. 组装发布目录 =====
      - name: Assemble release folder
        shell: bash
        run: |
          mkdir -p release/frontend
          # 可执行文件
          cp server.exe release/
          # 前端构建产物
          cp -r frontend/dist release/frontend/dist
          # 运行时配置
          cp config.json release/
          # README（用户文档入口）
          cp README.md release/
          # 文档：**不再随包分发 docs/**。
          # 维护者要求 docs/ 与 tests/ 不进版本控制（见 .gitignore），checkout 里已无 docs/，
          # 原先的 `cp -r docs/.` 与「排除 docs/audit + 反向守卫」成为空操作，故一并删除。
          echo "Docs are NOT packaged (docs/ is not tracked; see .gitignore)"
          # 版本信息
          echo "${{ steps.ver.outputs.tag }}" > release/VERSION.txt
          echo "Build: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> release/VERSION.txt
          echo "Commit: ${GITHUB_SHA}" >> release/VERSION.txt
          echo "Release folder assembled:"
          ls -R release | head -40

      # ===== 6. 打包 zip =====
      - name: Create zip package
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $zipName = "campus-energy-station-${tag}.zip"
          # Compress-Archive 需要先进入目录以避免外层 release/ 路径
          Compress-Archive -Path release\* -DestinationPath $zipName -Force
          Write-Host "Created: $zipName"
          Get-ChildItem $zipName | Select-Object Name, Length

      # ===== 7. 上传构建产物（便于下载检查） =====
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-energy-station-${{ steps.ver.outputs.tag }}
          path: campus-energy-station-${{ steps.ver.outputs.tag }}.zip
          retention-days: 30

      # ===== 8. 创建 GitHub Release =====
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          ZIP="campus-energy-station-${TAG}.zip"

          # 写入 release notes（heredoc 顶格，避免前导空格）
          cat > release_notes.md <<'EOF'
          # 校园文明能量站（Campus Energy Station）
          
          版本：${{ steps.ver.outputs.tag }}
          
          ## 本版要点
          - **安全修复（批次 0，已提交）**：修复 PBKDF2 认证绕过（任意口令可登录）；移除可预测的默认凭据，改为首启由 CSPRNG 生成随机初始口令并强制首登改密；CI 交付包不再打入 Mock 前端（此前包内前端与 `server.exe` 永久失联）。
          - **并发与数据正确性（批次 1）**：数据库连接改为**每线程一条**（此前 8 个 worker 线程共享同一 `sqlite3*`）；全局共享容器与索引加一把互斥锁；用户/积分查找不再返回可悬垂的裸指针，改为值拷贝或受锁回调；兑换改为单事务原子提交并校验受影响行数（此前可双花/无故扣库存）；登录失败锁定改为不可伪造的客户端标识（此前伪造 `X-Forwarded-For` 即可绕过）并覆盖家长端；所有 4xx/5xx 返回结构化 JSON（此前未处理异常为 500 + 空响应体，前端完全静默）。
          - **已知未闭合项**：批次 2 的若干数据正确性与一致性条目仍未修复（审计报告与证据保留在开发侧，不随包分发）。
          - 用户文档不再随本包分发（`docs/` 已不纳入版本控制），部署与使用说明见 `README.md`。
          
          ## 包含内容
          - `server.exe` — C++ 后端可执行文件（SQLite 静态链接，无需额外 dll）
          - `frontend/dist/` — Vite + Vue 3 SFC 构建产物
          - `config.json` — 运行时配置
          - `README.md` — 项目文档（含部署与使用说明）
          - `VERSION.txt` — 版本号 / 构建时间 / 提交号

          ## 快速开始
          1. 解压 zip 到任意目录
          2. 命令行运行 `server.exe` 启动服务
          3. 浏览器访问 `http://localhost:8080`

          ## 初始账号与初始口令（安全修复 V18 / B2 + F13）
          - 首次启动时，`server.exe` 会在**控制台输出每个内置账号（admin / teacher / student / parent）的随机初始口令**，
            并标记这些账号「首次登录必须修改口令」。
          - 请复制控制台提示的初始口令登录，登录后系统会**强制要求先修改口令**，改密成功后才能使用其他功能。
          - 初始口令**只打印一次**、不写入任何文件；请自行妥善保管。本项目**不再提供固定默认口令**。
          - 若丢失初始口令：删除数据目录下的 `campus_system.db`（见 `config.json` 的 `database.path`）后重启，
            系统会重新生成随机初始口令（**会清空全部数据**）。

          ## 运行环境
          - Windows 10/11（64 位）
          - 无需安装 Node.js（前端已预构建）
          - 无需安装额外 dll（SQLite 静态链接）

          ## 技术栈
          - 后端：C++17 + cpp-httplib + nlohmann/json + SQLite3（静态链接）
          - 前端：Vite + Vue 3 SFC + TypeScript + Tailwind CSS + ECharts
          - 认证：PBKDF2-HMAC-SHA256（随机盐，100000 次迭代）
          EOF

          # 去除每行前导 10 空格缩进（保持 heredoc 可读性）
          sed -i 's/^          //' release_notes.md

          # gh release create 会自动创建对应 tag（workflow_dispatch 场景）
          gh release create "$TAG" "$ZIP" \
            --title "$TAG" \
            --notes-file release_notes.md

          echo "Release $TAG created successfully"
